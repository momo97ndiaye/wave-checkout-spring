spring:
  application:
    name: wave-checkout-spring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wave}
    username: ${DB_USER:wave}
    password: ${DB_PASSWORD:wave}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

wave:
  base-url: https://api.wave.com
  api-key: ${WAVE_API_KEY:}
  signing-secret: ${WAVE_SIGNING_SECRET:change-me}
  success-url: ${WAVE_SUCCESS_URL:http://localhost:8080/paiement/succes}
  error-url: ${WAVE_ERROR_URL:http://localhost:8080/paiement/erreur}
